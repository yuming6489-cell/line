<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IZO LINE 名片分享</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 16px;
      background: #f1f7fa;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      color: #22374c;
    }

    .container {
      max-width: 430px;
      margin: auto;
      padding: 26px 20px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 6px 24px #22374c18;
      text-align: center;
    }

    h1 { font-size: 24px; }

    p {
      color: #64748b;
      line-height: 1.7;
    }

    button {
      display: block;
      width: 100%;
      padding: 17px;
      margin: 14px 0;
      border: 0;
      border-radius: 12px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #a6b7c3 !important;
      cursor: not-allowed;
    }

    #btnShare, #btnLogin {
      background: #06c755;
    }

    #btnLogOut {
      background: #64748b;
    }

    button[hidden] {
      display: none;
    }

    #status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      background: #edf5fa;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>IZO 名片分享</h1>
    <p>點選下方按鈕，將名片分享給 LINE 好友</p>

    <button id="btnShare" disabled>
      名片分享好友
    </button>

    <hr>

    <button id="btnLogin" hidden>LINE 登入</button>
    <button id="btnLogOut" hidden>LINE 登出</button>

    <div id="status" role="status" aria-live="polite">
      LIFF 初始化中...
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    const CONFIG = {
      liffId: "2012024073-Q0e1IQBp"
    };

    const $ = (id) => document.getElementById(id);

    function setStatus(message) {
      $("status").textContent = message;
    }

    function setShareEnabled(enabled) {
      $("btnShare").disabled = !enabled;
    }

    async function initializeLiff() {
      setShareEnabled(false);

      if (typeof liff === "undefined") {
        setStatus("LINE LIFF SDK 載入失敗");
        return;
      }

      try {
        await liff.init({
          liffId: CONFIG.liffId
        });

        updateLoginButtons();

        if (liff.isLoggedIn()) {
          setShareEnabled(true);
          setStatus("LINE 已登入，可以分享名片給好友");
        } else {
          setStatus("請先點擊 LINE 登入");
        }

      } catch (error) {
        console.error(error);
        setStatus("LIFF 初始化失敗：" + (error.message || String(error)));
      }
    }

    function updateLoginButtons() {
      const loggedIn = liff.isLoggedIn();

      $("btnLogin").hidden = loggedIn;
      $("btnLogOut").hidden = !loggedIn;

      if (liff.isInClient()) {
        $("btnLogOut").hidden = true;
      }
    }

    function login() {
      if (!liff.isLoggedIn()) {
        liff.login();
      }
    }

    function logOut() {
      if (liff.isLoggedIn()) {
        liff.logout();
        updateLoginButtons();
        setShareEnabled(false);
        setStatus("已登出，請重新登入");
      }
    }

    // ★ 這裡放你的 carousel JSON
    function createBusinessCard() {
      return {
        "type": "carousel",
        "contents": [
          {
            "type": "bubble",
            "hero": {
              "type": "image",
              "size": "full",
              "aspectRatio": "1:1.5",
              "aspectMode": "cover",
              "url": "https://r2.uploads.tw/2026/10/6X6VFkgTrA.webp"
            },
            "footer": {
              "type": "box",
              "layout": "vertical",
              "spacing": "sm",
              "contents": [
                {
                  "type": "button",
                  "style": "primary",
                  "action": {
                    "type": "uri",
                    "label": "昊霖預防醫療機構官網",
                    "uri": "https://izo.com.tw/"
                  },
                  "color": "#3d77ff"
                },
                {
                  "type": "button",
                  "action": {
                    "type": "uri",
                    "label": "昊霖預防醫療機構FACEBOOK",
                    "uri": "https://www.facebook.com/izohl/"
                  },
                  "color": "#3d77ff",
                  "style": "primary"
                }
              ]
            }
          },
          {
            "type": "bubble",
            "hero": {
              "type": "image",
              "size": "full",
              "aspectRatio": "1:1.5",
              "aspectMode": "cover",
              "url": "https://r2.uploads.tw/2026/10/LKFKwpzp2Y.webp"
            },
            "footer": {
              "type": "box",
              "layout": "vertical",
              "spacing": "sm",
              "contents": [
                {
                  "type": "button",
                  "flex": 2,
                  "style": "primary",
                  "color": "#00B900",
                  "action": {
                    "type": "uri",
                    "label": "昊霖診所LINE",
                    "uri": "https://lin.ee/XnCrhlU"
                  }
                },
                {
                  "type": "button",
                  "action": {
                    "type": "uri",
                    "label": "Youtube",
                    "uri": "https://www.youtube.com/@izohc./shorts"
                  },
                  "style": "primary",
                  "color": "#ec3232"
                }
              ]
            }
          }
        ]
      };
    }

    async function sendShare_Gift() {
      if (!liff.isLoggedIn()) {
        setStatus("請先登入 LINE");
        return;
      }

      if (!liff.isApiAvailable("shareTargetPicker")) {
        setStatus("目前環境不支援好友分享，請使用支援的 LINE 環境開啟 LIFF 網頁。");
        return;
      }

      setShareEnabled(false);
      setStatus("正在開啟 LINE 好友選擇畫面...");

      try {
        const message = {
          type: "flex",
          altText: "昊霖預防醫療機構名片分享",
          contents: createBusinessCard()
        };

        const result = await liff.shareTargetPicker(
          [message],
          { isMultiple: true }
        );

        if (result) {
          setStatus("名片分享已完成！");
        } else {
          setStatus("已取消分享，或未取得傳送確認");
        }

      } catch (error) {
        console.error(error);
        setStatus("分享失敗：" + (error.message || String(error)));
      } finally {
        setShareEnabled(liff.isLoggedIn());
      }
    }

    $("btnShare").addEventListener("click", sendShare_Gift);
    $("btnLogin").addEventListener("click", login);
    $("btnLogOut").addEventListener("click", logOut);

    initializeLiff();
  </script>
</body>
</html>
