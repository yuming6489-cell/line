
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>LINE 電子名片分享</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f2f7fa;
      text-align: center;
    }

    .container {
      max-width: 420px;
      margin: 30px auto;
      padding: 30px 20px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 25px #00000012;
    }

    h2 {
      color: #22374c;
    }

    p {
      color: #64748b;
      line-height: 1.7;
    }

    button {
      display: block;
      width: 100%;
      margin: 22px auto;
      padding: 18px;
      border: none;
      border-radius: 12px;
      background: #06c755;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #aab7bd;
      cursor: not-allowed;
    }

    #status {
      font-size: 14px;
      color: #64748b;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>IZO 電子名片</h2>

    <p>點擊下方按鈕<br>分享電子名片給 LINE 好友</p>

    <button id="shareBtn" disabled>
      分享 LINE 電子名片給好友
    </button>

    <p id="status">正在初始化 LINE...</p>
  </div>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>

    // ==========================================
    // 【設定區 1】填入你的 LIFF ID
    // ==========================================

    const LIFF_ID = "2012024073-Q0e1IQBp";


    // ==========================================
    // 【設定區 2】★★★ 貼上你的名片 JSON ★★★
    //
    // 可將以下 CARD_JSON 整段替換成
    // LINE Flex Message Simulator 的 JSON
    //
    // 支援：
    // A. 完整訊息：
    //    { "type": "flex", "altText": "...",
    //      "contents": {...} }
    //
    // B. 純 Bubble / Carousel：
    //    { "type": "bubble", ... }
    //
    // ==========================================

    const CARD_JSON = {

      "type": "flex",
      "altText": "IZO昊霖預防醫學機構電子名片",

      "contents": {
        "type": "bubble",

        "body": {
          "type": "box",
          "layout": "vertical",
          "spacing": "md",
          "contents": [
            {
              "type": "text",
              "text": "IZO 昊霖預防醫學機構",
              "weight": "bold",
              "size": "xl",
              "color": "#22374C",
              "wrap": true
            },
            {
              "type": "text",
              "text": "專業預防醫學・健康管理",
              "size": "sm",
              "color": "#218EC9",
              "wrap": true
            },
            {
              "type": "separator",
              "margin": "lg"
            },
            {
              "type": "text",
              "text": "歡迎了解我們的健康管理服務",
              "size": "sm",
              "color": "#666666",
              "wrap": true
            }
          ]
        },

        "footer": {
          "type": "box",
          "layout": "vertical",
          "contents": [
            {
              "type": "button",
              "style": "primary",
              "color": "#218EC9",
              "action": {
                "type": "uri",
                "label": "前往官方網站",
                "uri": "https://izohc.com.tw/"
              }
            }
          ]
        }
      }

    };

    // ==========================================
    // 【設定區結束】
    // 以下程式不用修改
    // ==========================================

    const shareBtn = document.getElementById("shareBtn");
    const statusText = document.getElementById("status");

    function setStatus(message) {
      statusText.textContent = message;
    }

    // 將 JSON 轉成 LINE Flex Message
    function getFlexMessage() {

      if (!CARD_JSON || typeof CARD_JSON !== "object") {
        throw new Error("名片 JSON 格式不正確");
      }

      // 完整 Flex Message
      if (CARD_JSON.type === "flex") {
        if (!CARD_JSON.contents) {
          throw new Error("Flex Message 缺少 contents");
        }
        return CARD_JSON;
      }

      // 純 Bubble / Carousel
      if (
        CARD_JSON.type === "bubble" ||
        CARD_JSON.type === "carousel"
      ) {
        return {
          type: "flex",
          altText: "電子名片分享",
          contents: CARD_JSON
        };
      }

      throw new Error(
        "請貼上完整 Flex Message 或 Bubble / Carousel JSON"
      );
    }

    // LIFF 初始化
    async function initializeLiff() {

      try {

        if (
          !LIFF_ID ||
          LIFF_ID === "2012024073-Q0e1IQBp"
        ) {
          setStatus("請先填入 LIFF ID");
          return;
        }

        await liff.init({
          liffId: LIFF_ID
        });

        // 尚未登入時，外部瀏覽器導向 LINE 登入
        if (!liff.isLoggedIn()) {
          setStatus("正在前往 LINE 登入...");
          liff.login({
            redirectUri: window.location.href
          });
          return;
        }

        if (!liff.isApiAvailable("shareTargetPicker")) {
          setStatus("目前環境不支援 LINE 好友分享");
          return;
        }

        shareBtn.disabled = false;
        setStatus("可以分享電子名片");

      } catch (error) {
        console.error(error);
        setStatus("初始化失敗：" + error.message);
      }
    }

    // 分享電子名片
    async function shareBusinessCard() {

      shareBtn.disabled = true;
      setStatus("正在開啟 LINE 好友選擇畫面...");

      try {

        const message = getFlexMessage();

        const result = await liff.shareTargetPicker(
          [message],
          {
            isMultiple: true
          }
        );

        if (result && result.status === "success") {
          setStatus("電子名片分享成功！");
        } else {
          setStatus("已取消分享或未取得傳送確認");
        }

      } catch (error) {
        console.error(error);
        setStatus("分享失敗：" + error.message);
      } finally {
        shareBtn.disabled = false;
      }
    }

    shareBtn.addEventListener(
      "click",
      shareBusinessCard
    );

    initializeLiff();

  </script>
</body>
</html>
