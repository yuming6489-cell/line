
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IZO LINE 名片分享</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 16px;
      background: #f1f7fa;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      color: #22374c;
    }

    .container {
      max-width: 430px;
      margin: auto;
      padding: 26px 20px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 6px 24px #22374c18;
      text-align: center;
    }

    h1 { font-size: 24px; }

    p {
      color: #64748b;
      line-height: 1.7;
    }

    button {
      display: block;
      width: 100%;
      padding: 17px;
      margin: 14px 0;
      border: 0;
      border-radius: 12px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #a6b7c3 !important;
      cursor: not-allowed;
    }

    #btnShare, #btnLogin {
      background: #06c755;
    }

    #btnLogOut {
      background: #64748b;
    }

    button[hidden] {
      display: none;
    }

    #status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      background: #edf5fa;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>IZO 名片分享</h1>

    <p>點選下方按鈕，將名片分享給 LINE 好友</p>

    <button id="btnShare" disabled>
      名片分享好友
    </button>

    <hr>

    <button id="btnLogin" hidden>LINE 登入</button>
    <button id="btnLogOut" hidden>LINE 登出</button>

    <div id="status" role="status" aria-live="polite">
      LIFF 初始化中...
    </div>

  </div>

  <!-- LINE 官方 LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>

    // =====================================
    // ★ 1. LIFF ID 設定
    // =====================================

    const CONFIG = {
      liffId: "2012024073-Q0e1IQBp"
    };

    const $ = (id) => document.getElementById(id);

    function setStatus(message) {
      $("status").textContent = message;
    }

    function setShareEnabled(enabled) {
      $("btnShare").disabled = !enabled;
    }


    // =====================================
    // ★ 2. LIFF 初始化
    // =====================================

    async function initializeLiff() {

      setShareEnabled(false);

      if (typeof liff === "undefined") {
        setStatus("LINE LIFF SDK 載入失敗");
        return;
      }

      try {

        await liff.init({
          liffId: CONFIG.liffId
        });

        updateLoginButtons();

        if (liff.isLoggedIn()) {

          setShareEnabled(true);
          setStatus("LINE 已登入，可以分享名片給好友");

        } else {

          setStatus("請先點擊 LINE 登入");

        }

      } catch (error) {

        console.error(error);

        setStatus(
          "LIFF 初始化失敗：" +
          (error.message || String(error))
        );

      }
    }


    // =====================================
    // ★ 3. LINE 登入與登出
    // =====================================

    function updateLoginButtons() {

      const loggedIn = liff.isLoggedIn();

      $("btnLogin").hidden = loggedIn;
      $("btnLogOut").hidden = !loggedIn;

      if (liff.isInClient()) {
        $("btnLogOut").hidden = true;
      }

    }

    function login() {
      if (!liff.isLoggedIn()) {
        liff.login();
      }
    }

    function logOut() {

      if (liff.isLoggedIn()) {

        liff.logout();
        updateLoginButtons();
        setShareEnabled(false);
        setStatus("已登出，請重新登入");

      }
    }


    // =====================================
    // ★ 4. FLEX MESSAGE JSON 自訂區
    //
    // ★★★ 以後要更換 JSON 就修改這裡 ★★★
    //
    // 將 LINE Flex Message Simulator
    // 產生的 bubble JSON 放在 return 後面
    // =====================================

    function createBusinessCard() {

      return {
        "type": "bubble",
        "hero": {
          "type": "image",
          "url": "https://developers-resource.landpress.line.me/fx/img/01_1_cafe.png",
          "size": "full",
          "aspectRatio": "20:13",
          "aspectMode": "cover",
          "action": {
            "type": "uri",
            "uri": "https://line.me/"
          }
        },
        "body": {
          "type": "box",
          "layout": "vertical",
          "contents": [
            {
              "type": "text",
              "text": "Brown Cafe",
              "weight": "bold",
              "size": "xl"
            },
            {
              "type": "box",
              "layout": "baseline",
              "margin": "md",
              "contents": [
                {
                  "type": "icon",
                  "size": "sm",
                  "url": "https://developers-resource.landpress.line.me/fx/img/review_gold_star_28.png"
                },
                {
                  "type": "icon",
                  "size": "sm",
                  "url": "https://developers-resource.landpress.line.me/fx/img/review_gold_star_28.png"
                },
                {
                  "type": "icon",
                  "size": "sm",
                  "url": "https://developers-resource.landpress.line.me/fx/img/review_gold_star_28.png"
                },
                {
                  "type": "icon",
                  "size": "sm",
                  "url": "https://developers-resource.landpress.line.me/fx/img/review_gold_star_28.png"
                },
                {
                  "type": "icon",
                  "size": "sm",
                  "url": "https://developers-resource.landpress.line.me/fx/img/review_gray_star_28.png"
                },
                {
                  "type": "text",
                  "text": "4.0",
                  "size": "sm",
                  "color": "#999999",
                  "margin": "md",
                  "flex": 0
                }
              ]
            },
            {
              "type": "box",
              "layout": "vertical",
              "margin": "lg",
              "spacing": "sm",
              "contents": [
                {
                  "type": "box",
                  "layout": "baseline",
                  "spacing": "sm",
                  "contents": [
                    {
                      "type": "text",
                      "text": "Place",
                      "color": "#aaaaaa",
                      "size": "sm",
                      "flex": 1
                    },
                    {
                      "type": "text",
                      "text": "Flex Tower, 7-7-4 Midori-ku, Tokyo",
                      "wrap": true,
                      "color": "#666666",
                      "size": "sm",
                      "flex": 5
                    }
                  ]
                },
                {
                  "type": "box",
                  "layout": "baseline",
                  "spacing": "sm",
                  "contents": [
                    {
                      "type": "text",
                      "text": "Time",
                      "color": "#aaaaaa",
                      "size": "sm",
                      "flex": 1
                    },
                    {
                      "type": "text",
                      "text": "10:00 - 23:00",
                      "wrap": true,
                      "color": "#666666",
                      "size": "sm",
                      "flex": 5
                    }
                  ]
                }
              ]
            }
          ]
        },
        "footer": {
          "type": "box",
          "layout": "vertical",
          "spacing": "sm",
          "contents": [
            {
              "type": "button",
              "style": "link",
              "height": "sm",
              "action": {
                "type": "uri",
                "label": "CALL",
                "uri": "https://line.me/"
              }
            },
            {
              "type": "button",
              "style": "link",
              "height": "sm",
              "action": {
                "type": "uri",
                "label": "WEBSITE",
                "uri": "https://line.me/"
              }
            },
            {
              "type": "box",
              "layout": "vertical",
              "contents": [],
              "margin": "sm"
            }
          ],
          "flex": 0
        }
      };

    }


    // =====================================
    // ★ 5. 名片分享功能
    // =====================================

    async function sendShare_Gift() {

      if (!liff.isLoggedIn()) {
        setStatus("請先登入 LINE");
        return;
      }

      if (!liff.isApiAvailable("shareTargetPicker")) {

        setStatus(
          "目前環境不支援好友分享，" +
          "請使用支援的 LINE 環境開啟 LIFF 網頁。"
        );

        return;
      }

      setShareEnabled(false);

      setStatus("正在開啟 LINE 好友選擇畫面...");

      try {

        // 將 bubble JSON 包裝為 Flex Message
        const message = {
          type: "flex",
          altText: "Brown Cafe 名片分享",
          contents: createBusinessCard()
        };

        const result = await liff.shareTargetPicker(
          [message],
          {
            isMultiple: true
          }
        );

        if (result) {

          setStatus("名片分享已完成！");

        } else {

          setStatus("已取消分享，或未取得傳送確認");

        }

      } catch (error) {

        console.error(error);

        setStatus(
          "分享失敗：" +
          (error.message || String(error))
        );

      } finally {

        setShareEnabled(liff.isLoggedIn());

      }

    }


    // =====================================
    // ★ 6. 綁定按鈕
    // =====================================

    $("btnShare").addEventListener(
      "click", sendShare_Gift
    );

    $("btnLogin").addEventListener(
      "click", login
    );

    $("btnLogOut").addEventListener(
      "click", logOut
    );


    // =====================================
    // ★ 7. 啟動 LIFF
    // =====================================

    initializeLiff();

  </script>

</body>
</html>
