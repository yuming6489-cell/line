
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>IZO LINE 好友分享</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 16px;
      background: #f1f7fa;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      color: #22374c;
    }

    .container {
      max-width: 430px;
      margin: auto;
      padding: 26px 20px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 6px 24px #22374c18;
      text-align: center;
    }

    h1 { font-size: 24px; }
    p { color: #64748b; line-height: 1.7; }

    button {
      display: block;
      width: 100%;
      padding: 17px;
      margin: 14px 0;
      border: 0;
      border-radius: 12px;
      background: #218ec9;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #a6b7c3;
      cursor: not-allowed;
    }

    #btnShare { background: #06c755; }
    #btnShare2 { background: #218ec9; }
    #btnShare3 { background: #22374c; }
    #btnLogin { background: #06c755; }
    #btnLogOut { background: #64748b; }

    #status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      background: #edf5fa;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>名片分享</h1>
    <p>點選下方按鈕，將圖文卡片分享給 LINE 好友</p>

    <button id="btnShare" disabled>名片分享好友</button>
    <button id="btnShare2" disabled>🎉 Ladder 活動邀請</button>
    <button id="btnShare3" disabled>💎 Pay 方案介紹</button>

    <hr>

    <button id="btnLogin" hidden>LINE 登入</button>
    <button id="btnLogOut" hidden>LINE 登出</button>

    <div id="status" role="status" aria-live="polite">
      LIFF 初始化中...
    </div>
  </div>

  <!-- LINE 官方 LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    // =====================================
    // ★ 1. 自訂設定區：修改這三個項目
    // =====================================

    const CONFIG = {
      // 改為你的 LIFF ID
      liffId: "2012024073-Q0e1IQBp",

      // 分享卡片的按鈕網址
      targetUrl: "https://izohc.com.tw/",

      // 圖片網址：需為公開 HTTPS 圖片
      imageBase: "https://placehold.co"
    };

    const $ = (id) => document.getElementById(id);

    const shareButtons = [
      $("btnShare"),
      $("btnShare2"),
      $("btnShare3")
    ];

    function setStatus(message) {
      $("status").textContent = message;
    }

    function setShareEnabled(enabled) {
      shareButtons.forEach(btn => {
        btn.disabled = !enabled;
      });
    }

    // =====================================
    // ★ 2. LIFF 初始化
    // =====================================

    async function initializeLiff() {
      setShareEnabled(false);

      if (
        !CONFIG.liffId ||
        CONFIG.liffId === "請填入你的LIFF_ID"
      ) {
        setStatus("請先在 CONFIG 填入 LIFF ID");
        return;
      }

      try {
        await liff.init({
          liffId: CONFIG.liffId
        });

        updateLoginButtons();

        if (liff.isLoggedIn()) {
          setShareEnabled(true);
          setStatus("LINE 已登入，可以分享給好友");
        } else {
          setStatus("請先點擊 LINE 登入");
        }

      } catch (error) {
        console.error(error);
        setStatus(
          "LIFF 初始化失敗：" +
          (error.message || String(error))
        );
      }
    }

    // =====================================
    // ★ 3. 登入與登出
    // =====================================

    function updateLoginButtons() {
      const loggedIn = liff.isLoggedIn();

      $("btnLogin").hidden = loggedIn;
      $("btnLogOut").hidden = !loggedIn;

      // LINE 內建 LIFF 瀏覽器不提供登出按鈕
      if (liff.isInClient()) {
        $("btnLogOut").hidden = true;
      }
    }

    function login() {
      if (!liff.isLoggedIn()) {
        liff.login();
      }
    }

    function logOut() {
      if (liff.isLoggedIn()) {
        liff.logout();
        updateLoginButtons();
        setShareEnabled(false);
        setStatus("已登出，請重新登入");
      }
    }

    // =====================================
    // ★ 4. Flex Message JSON 圖文卡片
    // =====================================

    function createFlexMessage(title, description, imageUrl) {
      return {
        type: "flex",
        altText: title,
        contents: {
          type: "bubble",

          hero: {
            type: "image",
            url: imageUrl,
            size: "full",
            aspectRatio: "2:1",
            aspectMode: "cover"
          },

          body: {
            type: "box",
            layout: "vertical",
            spacing: "md",
            contents: [
              {
                type: "text",
                text: title,
                weight: "bold",
                size: "xl",
                color: "#22374C",
                wrap: true
              },
              {
                type: "text",
                text: description,
                size: "sm",
                color: "#64748B",
                wrap: true
              }
            ]
          },

          footer: {
            type: "box",
            layout: "vertical",
            contents: [
              {
                type: "button",
                style: "primary",
                color: "#218EC9",
                action: {
                  type: "uri",
                  label: "立即了解",
                  uri: CONFIG.targetUrl
                }
              }
            ]
          }
        }
      };
    }

    // =====================================
    // ★ 5. 分享功能
    // =====================================

    async function shareCard(title, description, imageUrl) {
      if (!liff.isLoggedIn()) {
        setStatus("請先登入 LINE");
        return;
      }

      if (!liff.isApiAvailable("shareTargetPicker")) {
        setStatus(
          "目前環境不支援好友分享，" +
          "請使用手機 LINE 開啟 LIFF 網頁。"
        );
        return;
      }

      setShareEnabled(false);
      setStatus("正在開啟 LINE 好友選擇畫面...");

      try {
        const message = createFlexMessage(
          title,
          description,
          imageUrl
        );

        const result = await liff.shareTargetPicker(
          [message],
          { isMultiple: true }
        );

        if (result) {
          setStatus("分享已完成！");
        } else {
          setStatus("已取消分享，或未取得傳送確認");
        }

      } catch (error) {
        console.error(error);
        setStatus(
          "分享失敗：" +
          (error.message || String(error))
        );
      } finally {
        setShareEnabled(true);
      }
    }

    // =====================================
    // ★ 6. 原始三個分享按鈕
    // =====================================

    function sendShare_Gift() {
      return shareCard(
        "IZO 健康好禮",
        "把健康祝福分享給你的 LINE 好友！",
        CONFIG.imageBase +
          "/1040x520/06c755/ffffff.png?text=IZO+Gift"
      );
    }

    function sendShare_Ladder() {
      return shareCard(
        "IZO 健康應援活動",
        "邀請好友一起參加健康互動活動！",
        CONFIG.imageBase +
          "/1040x520/218ec9/ffffff.png?text=IZO+Event"
      );
    }

    function sendShare_Pay() {
      return shareCard(
        "IZO 專屬健康方案",
        "了解 IZO 預防醫學與健康管理服務。",
        CONFIG.imageBase +
          "/1040x520/22374c/ffffff.png?text=IZO+Plan"
      );
    }

    // =====================================
    // ★ 7. 綁定按鈕事件
    // =====================================

    $("btnShare").addEventListener(
      "click", sendShare_Gift
    );

    $("btnShare2").addEventListener(
      "click", sendShare_Ladder
    );

    $("btnShare3").addEventListener(
      "click", sendShare_Pay
    );

    $("btnLogin").addEventListener(
      "click", login
    );

    $("btnLogOut").addEventListener(
      "click", logOut
    );

    // 網頁開啟時自動執行
    initializeLiff();

  </script>
</body>
</html>
